name: Production SEO & Security Continuous Monitor

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Audit Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NeuroSyn Automated SEO & Security Audit
        run: python3 scripts/seo-audit.py
